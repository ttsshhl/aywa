<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Айва — маркетплейс готовых проектов</title>
<meta name="description" content="Айва — маркетплейс готовых проектов: приложения, игры, боты и сервисы с выручкой. Безопасная сделка, комиссия 10%.">
<meta name="theme-color" content="#FAFAF8">
<meta property="og:type" content="website">
<meta property="og:title" content="Айва — маркетплейс готовых проектов">
<meta property="og:description" content="Приложения, игры, боты и сервисы с живой аудиторией и выручкой. Сделка под защитой площадки.">
<meta property="og:locale" content="ru_RU">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F4EF; --card:#FFFFFF; --tint:#EDEBE3; --tint2:#F2F1EA;
  --ink:#121412; --muted:#5E635E; --faint:#767B76; --line:#E6E4DA; --line2:#D2CFC3;
  --shadow:0 16px 32px -24px rgba(20,24,20,.55);
  --quince:#177346; --quince-dk:#0F5733; --quince-soft:#E6F1EA;
  --gold:#8F6A12; --bad:#A03A28; --bad-soft:#F7EAE6;
  --ui:'Onest',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --disp:'Onest',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --w:1080px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:var(--w);margin:0 auto;padding:0 28px}
.wide{max-width:1300px}
:focus-visible{outline:2px solid var(--quince);outline-offset:2px;border-radius:3px}
.lbl{font-family:var(--mono);font-size:10.5px;line-height:1.4;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:500}

/* ── шапка ─────────────────────────────────────────────── */
header{border-bottom:1px solid var(--line);background:rgba(245,244,239,.86);backdrop-filter:saturate(1.4) blur(10px);position:sticky;top:0;z-index:30}
.head{display:flex;align-items:center;justify-content:space-between;height:60px;gap:24px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0}
.brand b{font-size:21px;font-weight:700;letter-spacing:-0.045em}
.brand svg{display:block;transition:transform .18s}
.brand:hover svg{transform:rotate(-6deg) scale(1.06)}
.head nav{display:flex;align-items:center;gap:4px}
.who{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line2);border-radius:8px;padding:5px 12px 5px 5px;font-size:13.5px}
.who:hover{border-color:var(--ink)}
.ava{width:24px;height:24px;border-radius:6px;background:var(--quince-soft);color:var(--quince-dk);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600}

.btn{border:1px solid var(--line2);background:var(--card);padding:9px 15px;border-radius:8px;font-size:13.5px;font-weight:500;letter-spacing:-0.01em;transition:border-color .15s,background .15s,color .15s}
.btn:hover{border-color:var(--ink)}
.btn-primary{background:var(--quince);border-color:var(--quince);color:#fff}
.btn-primary:hover{background:var(--quince-dk);border-color:var(--quince-dk)}
.btn-lg{padding:13px 20px;font-size:15px;width:100%}
.btn-ghost{border-color:transparent;background:none;color:var(--muted)}
.btn-ghost:hover{color:var(--ink);background:var(--tint2);border-color:transparent}
.btn-sm{padding:5px 11px;font-size:12.5px}
.btn-bad{color:var(--bad);border-color:#E0CBC5}
.btn-bad:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ── панель фильтров ───────────────────────────────────── */
.bar{position:sticky;top:60px;z-index:20;background:rgba(245,244,239,.9);backdrop-filter:saturate(1.4) blur(10px);margin:0 -28px 0;padding:0 28px;border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0 10px}
.bar-2{gap:8px;padding:0 0 12px}
.cats{display:flex;gap:4px;flex-wrap:wrap;margin-left:-10px}
.chip{border:0;background:none;padding:6px 11px;font-size:14px;font-weight:500;letter-spacing:-0.01em;color:var(--muted);border-radius:20px;display:flex;align-items:center;gap:7px}
.chip svg{opacity:.72}
.chip:hover{background:var(--tint2);color:var(--ink)}
.chip:hover svg{opacity:1}
.chip[aria-pressed="true"] svg{opacity:1}
.chip i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip[aria-pressed="true"] i{color:rgba(255,255,255,.6)}
.search{position:relative;display:block;flex:1;min-width:190px;max-width:270px;margin-left:auto}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:14px}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:0;border-color:var(--quince);box-shadow:0 0 0 3px var(--quince-soft)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.quicks{display:flex;gap:7px;flex-wrap:wrap}
.qf{border:1px solid var(--line);background:none;border-radius:20px;padding:5px 12px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.qf:hover{border-color:var(--line2);color:var(--ink)}
.qf[aria-pressed="true"]{border-color:var(--quince);color:var(--quince-dk);background:var(--quince-soft)}
.qf i{width:11px;height:11px;display:block;opacity:0}
.qf[aria-pressed="true"] i{opacity:1}
.sortbox{display:flex;align-items:center;gap:8px;margin-left:auto}
select{padding:5px 26px 5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:12.5px;color:var(--ink);appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='6' viewBox='0 0 9 6'><path d='M1 1l3.5 3.5L8 1' fill='none' stroke='%235E635E' stroke-width='1.4'/></svg>");background-repeat:no-repeat;background-position:right 10px center}

/* ── список стартапов ──────────────────────────────────── */
.reg{display:flex;flex-direction:column;gap:8px;padding:16px 0 80px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;width:100%;text-align:left;
     background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 18px;
     transition:transform .16s,box-shadow .16s,border-color .16s}
.row:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line2)}
.row:active{transform:translateY(0)}
.tile{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.tile svg{display:block}
.r-main{min-width:0}
.r-title{display:block;font-size:18px;font-weight:600;letter-spacing:-0.03em;line-height:1.2}
.r-tag{display:block;font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px 9px;margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:-0.01em}
.r-meta span{display:flex;align-items:center;gap:4px}
.r-meta .sep{width:3px;height:3px;border-radius:50%;background:var(--line2);display:block}
.r-rev{color:var(--quince);font-weight:500}
.r-price{text-align:right;white-space:nowrap;font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-0.05em;line-height:1;transition:color .16s}
.row:hover .r-price{color:var(--quince)}
.kindline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.r-ok{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--quince);font-weight:500}
.r-ok svg{flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 9px;border-radius:20px;font-size:12.5px;font-weight:500}
.empty{padding:44px 20px;color:var(--muted);font-size:14.5px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:5px;font-size:16px;letter-spacing:-0.02em}

/* ── скриншоты ─────────────────────────────────────────── */
.drop{border:1.5px dashed var(--line2);border-radius:12px;background:var(--card);padding:20px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--quince);background:var(--quince-soft)}
.drop b{display:block;font-size:14px;font-weight:500;margin-bottom:3px}
.drop span{font-size:12.5px;color:var(--muted)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:12px}
.shots:empty{display:none}
.shot{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--tint);aspect-ratio:4/3}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .x{position:absolute;top:5px;right:5px;width:22px;height:22px;border:0;border-radius:7px;background:rgba(18,20,18,.72);color:#fff;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.shot .cover{position:absolute;left:5px;bottom:5px;background:rgba(18,20,18,.72);color:#fff;font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:6px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin:0 0 30px}
.gal-i{padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--tint);aspect-ratio:16/10;display:block}
.gal-i img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.gal-i:hover img{transform:scale(1.04)}
.lb{background:rgba(12,14,12,.88);cursor:zoom-out}
.lb img{max-width:min(1100px,94vw);max-height:86vh;border-radius:12px;background:#fff}
.lb-x{position:fixed;top:16px;right:18px;width:36px;height:36px;border:0;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;font-size:20px;line-height:1;padding:0}
.minis{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.minis img{width:54px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}

/* ── общие мелочи ──────────────────────────────────────── */
.tag{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--tint);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag-ok{background:var(--quince-soft);border-color:#C7DFD1;color:var(--quince-dk)}
.tag-wait{background:#FAF1DA;border-color:#EADCB8;color:#7A5C10}
.tag-bad{background:var(--bad-soft);border-color:#E7D0CA;color:var(--bad)}
.price{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-0.035em;white-space:nowrap;text-align:right}
.price small{display:block;font-family:var(--ui);font-size:11.5px;font-weight:400;color:var(--faint);letter-spacing:0;margin-top:3px}
.back{background:none;border:0;padding:18px 0;font-size:13.5px;color:var(--muted)}
.back:hover{color:var(--ink)}
.shield{display:flex;gap:9px;font-size:12.5px;color:var(--muted);line-height:1.45;background:var(--tint2);border:1px solid var(--line);padding:11px 12px;border-radius:8px}
.shield svg{flex:none;margin-top:2px;color:var(--quince)}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.line{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--muted);padding:4px 0}
.line b{font-weight:500;color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:8px}

/* ── страница проекта ──────────────────────────────────── */
.detail{display:grid;grid-template-columns:1fr 300px;gap:56px;align-items:start;padding-bottom:76px}
.detail h1{margin:10px 0 8px;font-size:34px;line-height:1.1;letter-spacing:-0.04em;font-weight:600;max-width:18ch}
.lede{font-size:16px;color:var(--muted);margin:0 0 30px;max-width:56ch;line-height:1.55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:32px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.stat b{display:block;font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-0.04em;margin-top:5px}
.stat span{font-size:12px;color:var(--faint)}
.sec{margin-bottom:30px;max-width:64ch}
.sec h3{font-size:14px;font-weight:600;letter-spacing:-0.02em;margin:0 0 8px;color:var(--ink)}
.sec p{margin:0;color:#2B302C;font-size:15px;line-height:1.6}
.sec ul{margin:0;padding:0;list-style:none}
.sec li{position:relative;padding:7px 0 7px 20px;font-size:15px;color:#2B302C}
.sec li::before{content:"";position:absolute;left:3px;top:15px;width:5px;height:5px;border-radius:50%;background:var(--quince)}
.panel{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:20px;position:sticky;top:86px;box-shadow:var(--shadow)}
.panel .big{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-0.05em;margin:4px 0 3px}
.panel .note{font-size:12.5px;color:var(--muted);margin-bottom:18px}
.panel hr{border:0;border-top:1px solid var(--line);margin:16px 0}

/* ── формы ─────────────────────────────────────────────── */
.form{max-width:530px;padding-bottom:80px}
.form h1{margin:6px 0 10px;font-size:27px;letter-spacing:-0.035em;font-weight:600}
.form>p{color:var(--muted);margin:0 0 28px;font-size:14.5px;max-width:52ch}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--ink);margin-bottom:7px}
.field .hint{font-size:12px;color:var(--faint);font-weight:400;margin-left:6px}
.field input,.field textarea,.field select{width:100%;padding:11px 13px;border:1px solid var(--line2);border-radius:8px;background:var(--card);font-size:14.5px}
.field textarea{min-height:104px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{outline:0;border-color:var(--quince);box-shadow:0 0 0 3px var(--quince-soft)}
.field.bad input,.field.bad textarea{border-color:var(--bad)}
.err{display:none;color:var(--bad);font-size:12.5px;margin-top:5px}
.field.bad .err{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.calc{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:16px;margin:22px 0 26px}
.calc .line{padding:5px 0;font-size:13.5px}
.calc .tot{border-top:1px solid var(--line);margin-top:9px;padding-top:11px;font-size:15px;color:var(--ink);font-weight:600}

/* ── оплата ────────────────────────────────────────────── */
.pay{max-width:530px;padding-bottom:84px}
.pay h1{margin:6px 0 10px;font-size:27px;letter-spacing:-0.035em;font-weight:600}
.pay>p{color:var(--muted);margin:0 0 24px;font-size:14.5px}
.method{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:14px 15px;margin-bottom:8px;background:var(--card)}
.method:hover{border-color:var(--line2)}
.method[aria-checked="true"]{border-color:var(--quince);background:var(--quince-soft)}
.radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2);flex:none;margin-top:3px;display:flex;align-items:center;justify-content:center}
.method[aria-checked="true"] .radio{border-color:var(--quince)}
.method[aria-checked="true"] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--quince)}
.method b{display:block;font-size:14.5px;font-weight:500}
.method span{font-size:12.5px;color:var(--muted)}
.paying{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14.5px;padding:28px 0}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--quince);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── сделка ────────────────────────────────────────────── */
.deal-page{padding-bottom:84px}
.deal-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line)}
.deal-head h1{margin:9px 0 6px;font-size:26px;letter-spacing:-0.035em;font-weight:600}
.deal-head .sub{font-size:12.5px;color:var(--muted)}
.track{display:flex;margin:26px 0 30px}
.step{flex:1;position:relative;padding-top:22px;padding-right:12px;font-size:12px;color:var(--faint)}
.step::before{content:"";position:absolute;top:5px;left:0;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line2);z-index:2}
.step::after{content:"";position:absolute;top:9.5px;left:9px;right:0;height:1px;background:var(--line)}
.step:last-child::after{display:none}
.step.done::before{background:var(--quince);border-color:var(--quince)}
.step.done::after{background:var(--quince)}
.step.now::before{border-color:var(--quince);box-shadow:0 0 0 3px var(--quince-soft)}
.step.now{color:var(--ink);font-weight:500}
.cols{display:grid;grid-template-columns:1fr 300px;gap:56px;align-items:start}
.tl{border-top:1px solid var(--line)}
.tl div{padding:12px 2px;border-bottom:1px solid var(--line);font-size:14px;color:#2B302C;display:flex;justify-content:space-between;gap:16px}
.tl time{font-family:var(--mono);color:var(--faint);font-size:11.5px;white-space:nowrap}

/* ── кабинет ───────────────────────────────────────────── */
.cab{padding-bottom:76px}
.cab h1{margin:8px 0 20px;font-size:27px;letter-spacing:-0.035em;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:2px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-size:13.5px;color:var(--muted);white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--quince)}
.tab .dot{display:inline-block;min-width:17px;padding:0 5px;height:17px;line-height:17px;border-radius:9px;background:var(--tint);font-family:var(--mono);font-size:10.5px;margin-left:6px;color:var(--muted)}
.item{border-bottom:1px solid var(--line);padding:16px 14px;margin:0 -14px;border-radius:12px;display:flex;justify-content:space-between;gap:18px;align-items:flex-start;width:calc(100% + 28px);text-align:left;background:none;border-left:0;border-right:0;border-top:0;border-radius:10px;transition:background .14s}
button.item:hover{background:var(--card);box-shadow:0 1px 0 var(--line)}
.item-t{font-size:15px;font-weight:500;letter-spacing:-0.015em;margin-bottom:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item-m{font-size:12.5px;color:var(--muted)}

/* ── чат ───────────────────────────────────────────────── */
.chat{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:430px;padding-bottom:34px}
.chat-head{border-bottom:1px solid var(--line);padding-bottom:14px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.chat-head h2{margin:0 0 2px;font-size:18px;font-weight:600;letter-spacing:-0.025em}
.chat-head span{font-size:12.5px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:18px 2px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:72%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.45;border:1px solid var(--line)}
.msg time{display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px}
.msg.them{background:var(--card);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--quince-soft);border-color:#C7DFD1;align-self:flex-end;border-bottom-right-radius:4px}
.msg.sys{align-self:center;background:#FAF1DA;border-color:#EADCB8;color:#7A5C10;font-size:12.5px;text-align:center;max-width:52ch}

/* ============================================================

   Вставьте два значения из Project Settings → API.
   Пока они пустые, Айва работает в демо-режиме: данные лежат
   только в этом браузере. SQL для таблиц — в файле schema.sql.

   ВХОД ЧЕРЕЗ ЯНДЕКС ID:
   Custom-провайдер Supabase Яндексу не подходит: тот отдаёт почту
   в поле default_email, а Supabase ждёт стандартный ключ email.
   Поэтому обмен делает своя Edge Function yandex-auth (yandex-auth.ts).
   1) oauth.yandex.ru → приложение, права «Доступ к адресу почты»
      и «Доступ к логину, имени и фамилии, полу»;
   2) Redirect URI приложения:
      https://<ваш-проект>.supabase.co/functions/v1/yandex-auth/callback
   3) supabase functions deploy yandex-auth --no-verify-jwt
   4) Supabase → Edge Functions → Secrets: YANDEX_CLIENT_ID,
      YANDEX_CLIENT_SECRET, ALLOWED_REDIRECTS (адрес этой страницы).
   Функция возвращает человека сюда с одноразовым токеном в #ya=…,
   а страница меняет его на обычную сессию через /auth/v1/verify.
   Custom-провайдера в Supabase можно удалить, он больше не нужен.
   ============================================================ */
const SUPABASE_URL = 'https://ckxyzhyhmiostyjejflx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNreHl6aHlobWlvc3R5amVqZmx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDcxODMsImV4cCI6MjEwMzkyMzE4M30.GovGkgbb7Iuo261KjKuIhPtdu35yO8UrPn9s7Rp1DU8';
const REMOTE = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
let session = null;

async function sbFetch(path, opts = {}){
  const headers = Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + ((session && session.access_token) || SUPABASE_ANON_KEY),
    'Content-Type': 'application/json'
  }, opts.headers || {});
  const res = await fetch(SUPABASE_URL + path, Object.assign({}, opts, {headers}));
  const raw = await res.text();
  let data = null; try{ data = raw ? JSON.parse(raw) : null; }catch(e){ data = raw; }
  if(!res.ok) throw new Error((data && (data.error_description || data.msg || data.message || data.error)) || 'ошибка запроса');
  return data;
}
const sbSelect = (t, q='') => sbFetch(`/rest/v1/${t}?${q}`);
const sbInsert = (t, row, prefer='return=minimal') => sbFetch(`/rest/v1/${t}`, {method:'POST', headers:{Prefer:prefer}, body:JSON.stringify(row)});
const sbUpdate = (t, q, patch) => sbFetch(`/rest/v1/${t}?${q}`, {method:'PATCH', headers:{Prefer:'return=minimal'}, body:JSON.stringify(patch)});
async function push(fn){
  if(!REMOTE || !session) return;
  try{ await fn(); }catch(e){ console.error(e); toast('Сервер не принял изменение: ' + e.message); }
}

async function setSession(d){
  session = {access_token:d.access_token, refresh_token:d.refresh_token};
  const u = d.user || (await sbFetch('/auth/v1/user'));
  const md = u.user_metadata || {};
  const name = md.name || md.full_name || md.display_name || md.real_name
            || md.first_name || md.login || (u.email || '').split('@')[0] || 'Пользователь';
  const raw = md.auth_provider
           || (u.app_metadata && (u.app_metadata.provider || (u.app_metadata.providers||[])[0])) || 'email';
  const provider = /yandex/i.test(String(raw)) ? 'yandex' : raw;
  store.user = {id:u.id, name, email:u.email || '', provider,
                since:new Date(u.created_at || Date.now()).toLocaleDateString('ru-RU')};
  store.session = session;
  await save();
  await push(() => sbInsert('profiles', {id:u.id, name:store.user.name}, 'resolution=merge-duplicates'));
}
async function sbSignUp(email, password, name){
  const d = await sbFetch('/auth/v1/signup', {method:'POST', body:JSON.stringify({email, password, data:{name}})});
  if(d.access_token){ await setSession(d); return {ok:true}; }
  return {ok:false, confirm:true};
}
async function sbSignIn(email, password){
  const d = await sbFetch('/auth/v1/token?grant_type=password', {method:'POST', body:JSON.stringify({email, password})});
  await setSession(d); return {ok:true};
}
const YA_LOGO = `<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect width="18" height="18" rx="4" fill="#fff"/><path d="M9.9 14V4.9h-.8c-1.3 0-2 .7-2 1.8 0 1.2.5 1.7 1.5 2.4l.9.6L7 14H5.3l2.3-3.9C6.3 9.2 5.6 8.3 5.6 6.8 5.6 4.9 6.9 3.6 9.1 3.6h2.4V14H9.9Z" fill="#FC3F1D"/></svg>`;

/* вход через Яндекс ID — OAuth-провайдер Supabase */
let oauthNote = null;
const YA_FN = SUPABASE_URL + '/functions/v1/yandex-auth';
function yandexUrl(){
  const back = location.origin + location.pathname;
  return YA_FN + '/start?redirect=' + encodeURIComponent(back);
}
async function yandexLogin(){
  if(!REMOTE){
    store.user = {id:'local', name:'Гость Яндекса', email:'guest@yandex.ru', provider:'yandex', since:today()};
    await save();
    document.getElementById('modal').innerHTML = '';
    const cb = pending; pending = null;
    renderNav(); if(cb) cb(); else render();
    toast('Демо-режим: вход через Яндекс сымитирован');
    return;
  }
  // запоминаем, куда человек шёл: после возврата с Яндекса страница перезагрузится
  try{ await window.storage.set('ayva:intent', JSON.stringify({view:state.view, id:state.id})); }catch(e){}
  location.href = yandexUrl();
}
/* после входа возвращаем человека туда, куда он шёл */
async function restoreIntent(){
  try{
    const r = await window.storage.get('ayva:intent');
    if(r && r.value){
      const i = JSON.parse(r.value);
      if(i.view && i.view !== 'catalog'){ state.view = i.view; if(i.id) state.id = i.id; }
    }
    await window.storage.delete('ayva:intent');
  }catch(e){}
}

/* возврат после входа: сессия в хэше либо одноразовый токен */
async function consumeOAuth(){
  if(!REMOTE) return false;
  const h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  const dec = v => { if(!v) return v; try{ return decodeURIComponent(String(v).replace(/\+/g,' ')); }catch(e){ return v; } };
  const token = h.get('ya');
  const direct = h.get('access_token');          // GoTrue вернул сессию сам
  const err = dec(h.get('ya_error') || h.get('error_description'));
  if(!token && !direct && !err) return false;
  if(direct){
    try{
      await setSession({access_token:direct, refresh_token:h.get('refresh_token')});
      oauthNote = 'Вы вошли через Яндекс ID';
      await restoreIntent();
    }catch(e){ oauthNote = 'Не удалось завершить вход: ' + e.message; }
    history.replaceState(null, '', location.pathname);
    return true;
  }
  if(token){
    try{
      // GoTrue сверяет тип токена: ссылка выдана как magiclink, но на части
      // версий тот же токен проверяется как email — пробуем оба
      let d = null, last = null;
      for(const type of ['magiclink','email']){
        try{ d = await sbFetch('/auth/v1/verify', {method:'POST',
               body:JSON.stringify({type, token_hash:token})}); break; }
        catch(e){ last = e; }
      }
      if(!d) throw last;
      await setSession(d);
      oauthNote = 'Вы вошли через Яндекс ID';
      await restoreIntent();
    }catch(e){ oauthNote = 'Не удалось завершить вход: ' + e.message; }
  } else {
    oauthNote = 'Вход через Яндекс не завершён: ' + err;
  }
  history.replaceState(null, '', location.pathname);
  return !!token;
}

async function sbRestore(){
  if(!REMOTE || !store.session || !store.session.refresh_token) return;
  try{
    const d = await sbFetch('/auth/v1/token?grant_type=refresh_token', {method:'POST', body:JSON.stringify({refresh_token:store.session.refresh_token})});
    await setSession(d);
  }catch(e){ store.user = null; store.session = null; session = null; await save(); }
}

/* ── скриншоты: ужимаем на клиенте и кладём в Supabase Storage ───── */
function shrinkImage(file, max = 1600, quality = 0.82){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('файл не читается'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('это не картинка'));
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const preview = c.toDataURL('image/jpeg', 0.6);
        c.toBlob(blob => blob ? resolve({blob, url:preview}) : reject(new Error('не удалось сжать')),
                 'image/jpeg', quality);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function sbUpload(path, blob){
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${SHOT_BUCKET}/${path}`, {
    method:'POST', body:blob,
    headers:{apikey:SUPABASE_ANON_KEY, 'x-upsert':'true', 'Content-Type':'image/jpeg',
             Authorization:'Bearer ' + ((session && session.access_token) || SUPABASE_ANON_KEY)}
  });
  if(!res.ok) throw new Error('сервер ответил ' + res.status);
  return `${SUPABASE_URL}/storage/v1/object/public/${SHOT_BUCKET}/${path}`;
}

  const out = [];
  for(let i = 0; i < sellShots.length; i++){
    const path = `${store.user.id}/${listingId}/${i + 1}-${Date.now()}.jpg`;
    try{ out.push(await sbUpload(path, sellShots[i].blob)); }
    catch(e){ toast(`Скриншот ${i + 1} не загрузился: ${e.message}`); }
  }
  return out;
}
async function addShots(files){
  const picked = [...files].filter(f => /^image\/(png|jpe?g|webp)$/i.test(f.type));
  if(!picked.length){ toast('Подойдут png, jpg или webp'); return; }
  for(const f of picked){
    if(sellShots.length >= SHOT_MAX){ toast(`Больше ${SHOT_MAX} снимков не нужно`); break; }
    if(f.size > 12 * 1024 * 1024){ toast(`«${f.name}» тяжелее 12 МБ`); continue; }
    try{ sellShots.push(await shrinkImage(f)); }
    catch(e){ toast(`«${f.name}»: ${e.message}`); }
  }
  renderShots();
}
function renderShots(){
  const box = document.getElementById('pshotsGrid');
  if(!box) return;
  box.innerHTML = sellShots.map((s, i) => `<div class="shot">
      <img src="${s.url}" alt="Скриншот ${i + 1}">
      ${i === 0 ? '<span class="cover">обложка</span>' : ''}
      <button type="button" class="x" data-shot-del="${i}" aria-label="Убрать скриншот ${i + 1}">×</button>
    </div>`).join('');
  box.querySelectorAll('[data-shot-del]').forEach(b => b.onclick = () => {
    sellShots.splice(+b.dataset.shotDel, 1); renderShots();
  });
}

/* объявление на сервер: если в таблице нет колонки shots, кладём без неё */
async function insertListing(l){
  const row = {id:l.id, seller_id:store.user.id, seller_name:store.user.name,
    title:l.title, tagline:l.tagline, cat:l.cat, price:l.price, mrr:l.mrr,
    users_text:l.users, age_text:l.age, stack:l.stack, description:l.desc,
    why:l.why, shots:l.shots || [], status:l.status || 'На проверке'};
  try{
    await sbInsert('listings', row);
  }catch(e){
    if(/shots/i.test(e.message)){
      delete row.shots;
      await sbInsert('listings', row);
      toast('В таблице listings нет колонки shots — скриншоты сохранились только в браузере');
    } else throw e;
  }
}
/* то, что сервер не принял раньше, досылаем при следующем заходе */
async function syncPending(){
  if(!REMOTE || !session || !store.user) return;
  const waiting = store.listings.filter(l => l.pendingSync);
  if(!waiting.length) return;
  for(const l of waiting){
    try{ await insertListing(l); l.pendingSync = false; }
    catch(e){ console.error(e); }
  }
  await save();
}

async function pull(){
  if(!REMOTE) return;
  try{
    const ls = await sbSelect('listings','select=*&order=created_at.desc');
    const remote = ls.map(mapListing);
    const known = new Set(remote.map(l => l.id));
    // объявления, которые ещё не доехали до сервера, не теряем
    const waiting = store.listings.filter(l => l.pendingSync && !known.has(l.id));
    store.listings = [...waiting, ...remote];
    if(session){
      const [os, th] = await Promise.all([
        sbSelect('orders','select=*,order_events(*)&order=created_at.desc'),
        sbSelect('threads','select=*,messages(*)&order=created_at.desc')
      ]);
      store.orders = os.map(mapOrder);
      store.chats = {}; th.forEach(t => { store.chats[t.listing_id] = mapThread(t); });
    }
    await save();
  }catch(e){ console.error(e); toast('Не удалось загрузить данные: ' + e.message); }
}

const CONTACT_RE = [
  /(?:\+?\d[\d\-\s()]{8,}\d)/g,
  /[\w.+-]+@[\w-]+\.[\w.]{2,}/g,
  /(?:https?:\/\/|t\.me\/|wa\.me\/|vk\.com\/|www\.)\S+/gi,
  /(?:^|\s)@[a-zA-Z0-9_]{3,}/g
];
function maskContacts(text){
  let out = text, hit = false;
  CONTACT_RE.forEach(re => { if(re.test(out)){ hit = true; } out = out.replace(re, m => (/^\s/.test(m)?' ':'') + '[контакт скрыт]'); });
  return {text:out, hit};
}

const CAT_TINT = {
  'Приложения':  {ink:'#2F63D8', soft:'#E9EFFC'},

};
const tint = cat => CAT_TINT[cat] || {ink:'#177346', soft:'#E6F1EA'};

function pixSvg(grid, colors, size){
  let out = '';
  grid.forEach((row, y) => [...row].forEach((ch, x) => {
    const c = colors[ch];
    if(c) out += `<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`;
  }));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${PIX_W} ${PIX_W}" `
       + `shape-rendering="crispEdges" aria-hidden="true">${out}</svg>`;
}
function catIcon(cat, size, mono){
  const grid = PIX[cat] || PIX['Веб-сервисы'];
  const t = tint(cat);
  return pixSvg(grid, mono ? {'1':'currentColor','2':'none','3':'currentColor'}
                           : {'1':t.ink, '2':'#FFFFFF', '3':t.ink}, size || 22);
}
function catTile(cat, size){
  const t = tint(cat);
  return `<span class="tile" style="background:${t.soft}">${catIcon(cat, size || 24)}</span>`;
}
function catPill(cat){
  const t = tint(cat);
  return `<span class="pill" style="background:${t.soft};color:${t.ink}">`
       + `${catIcon(cat, 13, true)}${esc(KIND_LABEL[cat] || cat)}</span>`;
}
const ayvaMark = size => pixSvg(AYVA_PIX,

async function sendMsg(){
  const ta = document.getElementById('mtext');
  const raw = ta.value.trim(); if(!raw) return;
  const {text, hit} = maskContacts(raw);
  const c = store.chats[state.chatId];
  c.messages.push({from:'me', text, time:now()});
  c.updated = Date.now(); ta.value = '';
  const warn = 'Контакты скрыты. Оплата вне Айвы не защищена: вернуть деньги при обмане будет невозможно.';
  if(hit) c.messages.push({from:'sys', text:warn});
  await save(); render();
  await push(async () => {
    await sbInsert('messages', {thread_id:c.threadId, sender_id:store.user.id, kind:'user', body:text});
    if(hit) await sbInsert('messages', {thread_id:c.threadId, sender_id:store.user.id, kind:'system', body:warn});
    await sbUpdate('threads', 'id=eq.' + encodeURIComponent(c.threadId), {updated_at:new Date().toISOString()});
  });
  if(REMOTE) return;
  const n = c.messages.filter(m=>m.from==='them').length;
  if(n < REPLIES.length) setTimeout(async () => {
    c.messages.push({from:'them', text:REPLIES[n], time:now()}); c.updated = Date.now();
    await save(); if(state.view==='chat') render();
  }, 1400);
}

const FN = path => SUPABASE_URL + '/functions/v1/' + path;
async function callFn(path, body){
  const res = await fetch(FN(path), {method:'POST',
    headers:{'Content-Type':'application/json', apikey:SUPABASE_ANON_KEY,
             Authorization:'Bearer ' + ((session && session.access_token) || SUPABASE_ANON_KEY)},
    body:JSON.stringify(body || {})});
  const d = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(d.error || ('сервер ответил ' + res.status));
  return d;
}

async function pay(){

    }catch(e){
      area.innerHTML = `<button class="btn btn-primary btn-lg" id="payGo">Оплатить ${money(o.price)}</button>`;
      document.getElementById('payGo').onclick = pay;
      toast('Не удалось начать оплату: ' + e.message);

    return;
  }
  await new Promise(r => setTimeout(r, 1200));   // демо-режим без ключей
  o.status = 'Оплачена';
  const ev = `Оплата ${money(o.price)}, деньги на счёте Айвы`;
  o.events.push({t:shortDate(), text:ev});
  await save(); go('deal'); toast('Демо-режим: оплата сымитирована');
  const c = store.chats[o.listingId];
  if(c){ c.messages.push({from:'sys', text:`Покупатель оплатил сделку ${o.id}. Передайте доступы через Айву.`}); c.updated = Date.now(); }
  await push(async () => {
    await sbUpdate('orders', 'id=eq.' + encodeURIComponent(o.id), {status:'Оплачена'});
    await sbInsert('order_events', {order_id:o.id, text:ev});
  });
  if(REMOTE) return;
  setTimeout(async () => {
    if(o.status !== 'Оплачена') return;
    o.status = 'Доступы переданы';
    o.events.push({t:shortDate(), text:'Продавец передал доступы'});
    if(c) c.messages.push({from:'them', text:'Отправил доступы и репозиторий. Проверьте, что всё открывается.', time:now()});
    await save(); if(state.view==='deal') render();
    toast('Продавец передал доступы — проверьте и примите проект');
  }, 5000);
}

/* сделка */
function viewDeal(){
  const o = order(state.dealId); if(!o) return `<div class="empty"><b>Сделка не найдена</b></div>`;
  const asSeller = !!o.sellerMine && !o.mine;
  const step = STATUS_STEP[o.status];
  const cls = i => o.status==='Отменена' ? '' : (i < step ? 'done' : i === step ? 'now' : '');
  const wait = t => `<div class="note" style="font-size:13.5px;color:var(--muted)">${t}</div>`;
  let actions = '';
  if(asSeller){
    if(o.status === 'Ожидает оплаты') actions = wait('Покупатель ещё не оплатил. Доступы передавать рано — ответьте на вопросы в чате.');
    else if(o.status === 'Оплачена') actions = `
      <button class="btn btn-primary btn-lg" data-handover="${o.id}">Отметить передачу доступов</button>
      ${wait('Деньги покупателя уже на счёте Айвы. Передайте доступы и отметьте это здесь.')}`;
    else if(o.status === 'Доступы переданы') actions = wait('Ждём, пока покупатель проверит доступы и примет проект. После этого выплата уходит вам.');
    else if(o.status === 'Завершена') actions = `<div class="shield">${shieldIcon()}<span>Сделка закрыта. Вам переведено ${money(o.price*(1-FEE))}, комиссия Айвы — ${money(o.price*FEE)}.</span></div>`;
    else if(o.status === 'Спор') actions = wait('Покупатель открыл спор. Опишите свою сторону в чате, Айва разберётся.');
    else actions = wait('Сделка отменена.');
  }
  else if(o.status === 'Ожидает оплаты') actions = `
    <button class="btn btn-primary btn-lg" data-pay="${o.id}">Перейти к оплате</button>
    <button class="btn btn-lg btn-bad" data-cancel="${o.id}">Отменить сделку</button>`;
  else if(o.status === 'Оплачена') actions = wait('Деньги на счёте Айвы. Ждём, когда продавец передаст доступы.');
  else if(o.status === 'Доступы переданы') actions = `
    <button class="btn btn-primary btn-lg" data-accept="${o.id}">Принять проект и закрыть сделку</button>
    <button class="btn btn-lg btn-bad" data-dispute="${o.id}">Что-то не так, открыть спор</button>`;
  else if(o.status === 'Завершена') actions = `<div class="shield">${shieldIcon()}<span>Сделка закрыта. Продавец получил ${money(o.price*(1-FEE))}, комиссия Айвы — ${money(o.price*FEE)}.</span></div>`;
  else if(o.status === 'Спор') actions = wait('Спор открыт, деньги заморожены. Айва разбирается и вернётся к вам в чате.');
  else actions = wait('Сделка отменена, деньги не списывались.');

  return `
  <button class="back" data-back-cab="${asSeller?'sales':'deals'}">Назад в кабинет</button>
  <div class="deal-page">
    <div class="deal-head">
      <div>
        <span class="tag ${o.status==='Завершена'?'tag-ok':o.status==='Отменена'||o.status==='Спор'?'tag-bad':'tag-wait'}">${esc(o.status)}</span>
        <h1>${esc(o.title)}</h1>
        <div class="sub">Сделка ${esc(o.id)}, создана ${esc(o.date)}${asSeller?`, покупатель ${esc(o.buyer)}`:''}</div>
      </div>
      <div class="price num" style="font-size:26px">${money(o.price)}</div>
    </div>
    <div class="track">${FLOW.map((f,i)=>`<div class="step ${cls(i)}"><b>${f}</b></div>`).join('')}</div>
    <div class="cols">
      <div>
        <div class="sec"><h3>История сделки</h3>
          <div class="tl">${o.events.map(e=>`<div><span>${esc(e.text)}</span><time>${esc(e.t)}</time></div>`).join('')}</div>
        </div>
      </div>
      <aside class="panel">
        <div class="line"><span>Цена</span><b class="num">${money(o.price)}</b></div>
        <div class="line"><span>Комиссия Айвы</span><b class="num">${money(o.price*FEE)}</b></div>
        <div class="line"><span>${asSeller?'Вы получите':'Продавцу'}</span><b class="num">${money(o.price*(1-FEE))}</b></div>
        <hr>
        <div class="stack">${actions}
          <button class="btn btn-lg" data-chat="${o.listingId}">Открыть чат</button>
        </div>
      </aside>
    </div>
  </div>`;
}
async function act(id, kind){
  const o = order(id);
  if(kind==='cancel'){ o.status='Отменена'; o.events.push({t:shortDate(),text:'Покупатель отменил сделку'}); }
  if(kind==='accept'){ o.status='Завершена'; o.events.push({t:shortDate(),text:`Покупатель принял проект, продавцу переведено ${money(o.price*(1-FEE))}`}); }
  if(kind==='handover'){ o.status='Доступы переданы'; o.events.push({t:shortDate(),text:'Продавец отметил передачу доступов'}); }
  if(kind==='dispute'){ o.status='Спор'; o.events.push({t:shortDate(),text:'Открыт спор, деньги заморожены'}); }
  await save(); render();
  if(kind==='handover'){
    const c = store.chats[o.listingId];
    if(c){ c.messages.push({from:'sys', text:'Продавец передал доступы. Проверьте их и примите проект — после этого деньги уйдут продавцу.'}); c.updated = Date.now(); await save(); }
    await push(() => sbInsert('messages', {thread_id:(c&&c.threadId)||(o.listingId+':'+store.user.id), sender_id:store.user.id,
      kind:'system', body:'Продавец передал доступы.'}));
  }
  await push(async () => {
    await sbUpdate('orders', 'id=eq.' + encodeURIComponent(o.id), {status:o.status});
    await sbInsert('order_events', {order_id:o.id, text:o.events[o.events.length-1].text});
  });
  if(kind === 'accept' && REMOTE && session){
    // при двухстадийном платеже удержанные деньги списываются здесь
    try{ await callFn('yookassa/capture', {order_id:o.id}); }
    catch(e){ toast('Приёмка отмечена, но списание не прошло: ' + e.message); }
  }
  toast(kind==='accept'?'Сделка закрыта, деньги ушли продавцу'
      :kind==='cancel'?'Сделка отменена'
      :kind==='handover'?'Отмечено: доступы переданы покупателю'
      :'Спор открыт, мы разберёмся');
}

async function submitListing(){
  let err = false;
  err = bad('pname', !val('pname')) || err;
  err = bad('ptag', !val('ptag')) || err;
  err = bad('pdesc', !val('pdesc')) || err;
  err = bad('pprice', num(val('pprice')) < 1000) || err;
  if(err){ app.querySelector('.field.bad input, .field.bad textarea').focus(); return; }
  const d = maskContacts(val('pdesc')), t = maskContacts(val('ptag'));

  btn.disabled = true;

  const shots = await uploadShots(id);
  const rec = {id, mine:true, status:'На проверке', title:val('pname'), tagline:t.text, cat:val('pcat'),
    price:num(val('pprice')), mrr:num(val('pmrr')), users:val('pusers'), age:val('page'), stack:val('pstack'),
    desc:d.text, why:val('pwhy'), includes:[], shots, seller:store.user.name,
    deals:'первая продажа', reply:'обычно за день', date:today()};
  store.listings.unshift(rec);
  await save();
  let failed = null;
  if(REMOTE && session){
    try{ await insertListing(rec); }
    catch(e){ rec.pendingSync = true; failed = e.message; await save(); }
  }
  sellShots = [];
  state.tab='listings'; go('cabinet');
  if(failed) toast('Сервер не принял объявление: ' + failed + '. Пришлём его при следующем заходе');
  else toast(d.hit||t.hit ? 'Объявление отправлено, контакты в тексте скрыты' : 'Объявление отправлено на проверку');
}

    <h3>Объявления на проверке</h3>
    ${mod.length ? mod.map(l=>`<div class="modrow">
      <div style="min-width:0"><div class="item-t">${esc(l.title)} <span class="tag">${esc(l.cat)}</span></div>
      <div class="item-m">${esc(l.tagline)}</div>
      <div class="item-m" style="margin-top:6px">${money(l.price)}, продавец ${esc(l.seller)}${l.mrr>0?`, выручка ${money(l.mrr)} в месяц`:', без выручки'}</div>
      ${(l.shots||[]).length?`<div class="minis">${l.shots.slice(0,4).map(u=>`<img src="${esc(u)}" alt="" loading="lazy">`).join('')}</div>`:''}</div>
      <div class="acts"><button class="btn btn-sm btn-primary" data-approve="${l.id}">Опубликовать</button>
      <button class="btn btn-sm" data-reject="${l.id}">Отклонить</button></div></div>`).join('')
      : `<div class="empty" style="padding:24px 4px">Новых объявлений нет.</div>`}

    <h3 style="margin-top:30px">Переписки</h3>
    ${chats.length ? chats.map(c=>`<div class="modrow">
      <div><div class="item-t">${esc(c.seller)} — ${esc(c.title)}</div>
      <div class="item-m">${c.messages.filter(m=>m.from!=='sys').length} ${plural(c.messages.filter(m=>m.from!=='sys').length,'сообщение','сообщения','сообщений')}${c.messages.some(m=>m.text.includes('[контакт скрыт]'))?', есть скрытые контакты':''}</div></div>
      <button class="btn btn-sm" data-chat="${c.listingId}">Открыть</button></div>`).join('')
      : `<div class="empty" style="padding:24px 4px">Переписок пока нет.</div>`}
  </div>`;
}

/* рендер */
function render(){
  const v = {catalog:viewCatalog, listing:viewListing, order:viewOrder, sell:viewSell, pay:viewPay,
             deal:viewDeal, cabinet:viewCabinet, chat:viewChat, admin:viewAdmin}[state.view];
  app.className = state.view === 'admin' ? 'wrap wide' : 'wrap';
  try{
    app.innerHTML = v(); bind();
  }catch(e){
    console.error(e);
    app.innerHTML = `<div class="empty"><b>Страница не открылась</b>${esc(e.message)}. Обновите вкладку — если повторится, откройте консоль браузера.</div>`;
  }
  const m = document.getElementById('msgs'); if(m) m.scrollTop = m.scrollHeight;
}
function bind(){
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go('listing', b.dataset.open));
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    if(b.dataset.go==='sell') return requireAuth('Чтобы выставить проект, представьтесь.', ()=>go('sell'));
    go(b.dataset.go);
  });
  app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ state.cat=b.dataset.cat; render(); });
  app.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{ const k=b.dataset.quick; state.quick[k]=!state.quick[k]; render(); });
  app.querySelectorAll('[data-qf]').forEach(b=>b.onclick=()=>{ state.qf[b.dataset.qf] = !state.qf[b.dataset.qf]; render(); });
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; render(); });
  app.querySelectorAll('[data-back-cab]').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.backCab; go('cabinet'); });
  app.querySelectorAll('[data-deal]').forEach(b=>b.onclick=()=>{ state.dealId=b.dataset.deal; go('deal'); });
  app.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{ state.dealId=b.dataset.pay; go('pay'); });
  app.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>act(b.dataset.cancel,'cancel'));
  app.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>act(b.dataset.accept,'accept'));
  app.querySelectorAll('[data-refund]').forEach(b=>b.onclick=async ()=>{
    if(!confirm('Вернуть деньги покупателю по сделке ' + b.dataset.refund + '?')) return;
    b.disabled = true;
    try{ await callFn('yookassa/refund', {order_id:b.dataset.refund}); await pull(); render(); toast('Возврат отправлен в ЮKassa'); }
    catch(e){ b.disabled = false; toast('Возврат не прошёл: ' + e.message); }
  });
  app.querySelectorAll('[data-dispute]').forEach(b=>b.onclick=()=>act(b.dataset.dispute,'dispute'));
  app.querySelectorAll('[data-handover]').forEach(b=>b.onclick=()=>act(b.dataset.handover,'handover'));
  app.querySelectorAll('[data-order]').forEach(b=>{ const id=b.dataset.order;
    b.onclick=()=>requireAuth('Чтобы оформить заказ, войдите — сделка сохранится в кабинете.', ()=>go('order', id)); });
  app.querySelectorAll('[data-chat]').forEach(b=>{ const id=b.dataset.chat;
    b.onclick=()=>requireAuth('Чтобы написать продавцу, представьтесь.', ()=>openChat(id)); });
  app.querySelectorAll('[data-m]').forEach(el=>{
    const pick=()=>{ state.method=el.dataset.m; render(); };
    el.onclick=pick; el.onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); pick(); } };
  });

  app.querySelectorAll('[data-shot]').forEach(b=>b.onclick=()=>openShot(b.dataset.shot));
  const fi=document.getElementById('pshots'), dz=document.getElementById('pdrop');
  if(fi && dz){
    dz.onclick=()=>fi.click();
    dz.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fi.click(); } };
    fi.onchange=e=>{ addShots(e.target.files); fi.value=''; };
    ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{ e.preventDefault(); dz.classList.add('over'); }));
    ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{ e.preventDefault(); dz.classList.remove('over'); }));
    dz.addEventListener('drop', e => addShots(e.dataTransfer.files));
    renderShots();
  }

  const q=document.getElementById('q');
  if(q) q.oninput=debounce(e=>{ state.q=e.target.value; render(); const el=document.getElementById('q'); el.focus(); el.setSelectionRange(el.value.length,el.value.length); },220);
  const s=document.getElementById('sort'); if(s) s.onchange=e=>{ state.sort=e.target.value; render(); };
  const p=document.getElementById('pprice'); if(p) p.oninput=calc;
  const so=document.getElementById('sendOrder'); if(so) so.onclick=submitOrder;
  const sl=document.getElementById('sendListing'); if(sl) sl.onclick=submitListing;
  const pg=document.getElementById('payGo'); if(pg) pg.onclick=pay;
  const ms=document.getElementById('msend'); if(ms) ms.onclick=sendMsg;
  const mt=document.getElementById('mtext'); if(mt) mt.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMsg(); } };
  const lo=document.getElementById('logout'); if(lo) lo.onclick=async()=>{
    await push(() => sbFetch('/auth/v1/logout', {method:'POST'}));
    session=null; store.user=null; store.session=null;
    if(REMOTE){ store.listings=[]; store.orders=[]; store.chats={}; }
    await save(); renderNav(); go('catalog'); toast('Вы вышли');
  };

  app.querySelectorAll('[data-status]').forEach(sel=>sel.onchange=async e=>{
    const o=order(sel.dataset.status); o.status=e.target.value;
    const text = `Статус изменён владельцем: ${o.status}`;
    o.events.push({t:shortDate(), text});
    await save(); render(); toast(`${o.id}: ${o.status}`);
    await push(async () => {
      await sbUpdate('orders', 'id=eq.' + encodeURIComponent(o.id), {status:o.status});
      await sbInsert('order_events', {order_id:o.id, text});
    });
  });
  app.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{
    const l = store.listings.find(x=>x.id===b.dataset.approve);
    l.status='Опубликовано'; await save(); render(); toast('Объявление в каталоге');
    await push(() => sbUpdate('listings', 'id=eq.' + encodeURIComponent(l.id), {status:'Опубликовано'}));
  });
  app.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{
    const l = store.listings.find(x=>x.id===b.dataset.reject);
    l.status='Отклонено'; await save(); render(); toast('Объявление отклонено');
    await push(() => sbUpdate('listings', 'id=eq.' + encodeURIComponent(l.id), {status:'Отклонено'}));
  });
}
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function calc(){
  const p=num(document.getElementById('pprice').value);
  document.getElementById('cPrice').textContent=money(p);
  document.getElementById('cFee').textContent='−'+money(p*FEE);
  document.getElementById('cNet').textContent=money(p*(1-FEE));
}
const num=v=>Math.max(0,parseInt(String(v).replace(/\D/g,''),10)||0);
const val=id=>document.getElementById(id).value.trim();
function bad(id,on){ document.getElementById(id).closest('.field').classList.toggle('bad',on); return on; }

document.getElementById('logo').onclick=()=>go('catalog');
window.addEventListener('hashchange', () => { if(location.hash === '#owner') openOwner(); });
load().then(()=>{
  renderNav();
  if(location.hash === '#owner') openOwner(); else render();
  if(oauthNote) toast(oauthNote);
});
</script>
</body>
